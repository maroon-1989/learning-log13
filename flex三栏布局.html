<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex三栏布局</title>
    <style>
        .box1{
            
            min-height: 200px;
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }
        .left, .right{
            width:200px;
            background-color: maroon;
            min-width: 200px;
        }
        .center{
            flex: 1;
            background-color: rgb(0, 255, 26);
            max-width: 600px; 
        }
        
        .box2{
            display: flex;
            justify-content: center;
            min-height: 200px;
           
        
        }
        .a, .c{
            flex: 0 0 200px;
            width: 200px;
            background-color: maroon;
            min-width: 0;

            
        }
        .b{
            flex-grow: 1;
            background-color: rgb(0, 255, 26);
            min-width: 400px;
            max-width: 600px;
        }

    </style>
</head>
<body>
    <div class="box1">
        <div class="left">Left</div>
        <div class="center">Center</div>
        <div class="right">Right</div>
    </div>
    <div class="box2">
        <div class="a"></div>
        <div class="b"></div>
        <div class="c"></div>
    </div>
    
</body>
</html>
