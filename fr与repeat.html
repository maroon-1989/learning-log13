<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fr与repeat</title>
    <style>
        .box1{
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(2,100px 1fr) auto;
            grid-template-rows: repeat(2,100px 1fr) auto;
            gap: 10px;
        }
        .son{
            border: 1px solid brown;
            background-color: aqua;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="box1">
        <div class="son">1</div>
        <div class="son">2</div>
        <div class="son">3</div>
        <div class="son">4</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">100px</div>
        <div class="son">6</div>
        <div class="son">7</div>
        <div class="son">8</div>
        <div class="son">9</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">180px</div>
        <div class="son">11</div>
        <div class="son">12</div>
        <div class="son">13</div>
        <div class="son">14</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">100px</div>
        <div class="son">16</div>
        <div class="son">17</div>
        <div class="son">18</div>
        <div class="son">19</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">180px</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">100px</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">180px</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">100px</div>
        <div class="son"style="background-color: lightcoral;font-size: 20px;">180px</div>
        

    </div>
    
</body>
</html>
