<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html 练习</title>
</head>
<body>
    <h1>这是一个标题标签</h1>
    <h2>这是一个标题标签</h2>
    <h3>这是一个标题标签</h3>
    <h4>这是一个标题标签</h4>
    <h5>这是一个标题标签</h5>
    <h6>这是一个标题标签</h6>
    <p>这是一个段落标签  <b>字体加粗</b><i>斜体</i> 
    <u>下划线</u><s>删除线</s></p>
    <ul>
        <li>列表项1</li>
        <li>列表项2</li>
        <li>列表项3</li>
    </ul>
    <ol>
        <li>有序列表项1</li>
        <li>有序列表项2</li>
        <li>有序列表项3</li>
    </ol>
    <table border="1">
        <tr>
            <th>小写字母</th>
            <th>大写字母</th>
            <th>数字</th>
        </tr>
        <tr>
            <td>a</td>
            <td>A</td>
            <td>1</td>
        </tr>
        <tr>
            <td>b</td>
            <td>B</td>
            <td>2</td>
        </tr>
        <tr>
            <td>c</td>
            <td>C</td>
            <td>3</td>
        </tr>
    </table>

    
</body>
</html>
