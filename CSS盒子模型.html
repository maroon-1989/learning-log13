<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS盒子模型</title>
    <style>
        .demo{
            background-color: red;
            display: inline-block;
            width: 200px;
            height: 100px;
            border: 5px solid aqua;
            padding: 30px;
            margin: 20px;
        }
        .demomax{
            background-color: rgb(221, 0, 255);
            width: 300px;
            height: 150px;
            border-width: 10px 22px 15px 12px;
            border-style: solid dashed dotted double;
            border-color: green;

            
            
        }
    </style>
</head>
<body>
    <div class="demo">这是一个CSS盒子模型边框示例</div>
    

    <div class="demomax">这又是一个CSS盒子模型边框示例</div>
    
</body>
</html>
