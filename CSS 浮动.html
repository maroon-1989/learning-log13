<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS浮动</title>
    <style>
        .father{
            width: 400px;
            height: ;
            background-color: aqua;
            border: 10px  solid brown;
            /* overflow: hidden; */
        }
        .son-left{
            width: 100px;
            height: 100px;
            background-color: red;
            float: left;
            
        }
        .son-right{
            width: 100px;
            height: 100px;
            background-color: rgb(0, 255, 26);
            float: right;
            
        }
        .father::after{
            content:"";
            display: table;
            clear: both;
        }
    </style>
</head>
<body>
    <div class="father">
        <div class="son-left">左浮动元素</div>
        <div class="son-right">右浮动元素</div>
        
        
    </div>
    <p>这是一个段落</p>
    
</body>
</html>
