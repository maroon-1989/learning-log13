<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网格线,span关键字,区域命名定位.html</title>
    <style>
        .box1{
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns:repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }
        .a{
            grid-column: 1 / 3;
            grid-row: 1 / 3;
            background-color: aqua;
        }
        .b{
            grid-column: 3 / 7;
            grid-row: 1 / 3;
            background-color: lightcoral;
        }
        .c{
            grid-column: 5 / 7;
            grid-row: 3 / 7;
            background-color: lightblue;
        }
        .d{
            grid-column: 1 / 5;
            grid-row: 3 / 7;
            background-color: lightgreen;
        }
        .box2{
            width: 600px;
            height: 600px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            margin-top: 50px;
            margin-bottom: 200px;
        }
        .A{
            grid-column: span 2;
            grid-row: span 2;
            background-color: aqua;
        }
        .B{
            grid-column: 3/span 4;
            grid-row: 1/span 2;
            background-color: lightcoral;
        }
        .D{
            grid-column: span 4;
            grid-row:3 /span 4;
            background-color: lightgreen;
        }
        .C{
            grid-column: 5 / span 2;
            grid-row: 3 / span 4;
            background-color: lightblue;
        }
        .box3{
            width: 600px;
            height: 600px;
            margin-top: 50px;
            margin-bottom: 200px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            grid-template-areas:
            "small long long"
            "big big tall"
            "big big tall"
           
        }  
        .small{
                grid-area: small;
                background-color: aqua;
            }
        .long{
            grid-area: long;
            background-color: lightcoral;
        }
        .bis{
            grid-area: big;
            background-color: lightgreen;
        }
        .tall{
            grid-area: tall;
            background-color: lightblue;
        }

     </style>
</head>
<body>
    <div class="box1">
        <div class="a">小块</div>
        <div class="b">扁块</div>
        <div class="c">长块</div>
        <div class="d">大块</div>
    </div>
    <div class="box2">
        <div class="A">小块</div>
        <div class="B">扁块</div>
        <div class="C">长块</div>
        <div class="D">大块</div>
    </div>
    <div class="box3">
        <div class="small">小块</div>
        <div class="long">扁块</div>
        <div class="bis">大块</div>
        <div class="tall">长块</div>
    </div>
    
</body>
</html>
