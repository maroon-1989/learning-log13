<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>align-self与order</title>
    <style>
        .box1{
            display: flex;
            justify-content: center;
            min-height: 400px;
            border: 1px solid brown;
            margin-top: 50px;
            align-items: flex-end;
        }
        .BLOCK{
            width: 100px;
            height: 100px;
            background-color: rgb(0, 255, 26);
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            align-self: flex-start;
        }
        .special{
            width: 80px;
            height: 80px;
            background-color: rgb(255, 0, 0);
            margin: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            align-self: baseline; 
            font-size: 50px;
            /* order: -1; */
        }
    </style>

</head>
<body>
    <div class="box1">
        <div class="BLOCK">111</div>
        <div class="special">2</div>
        <div class="BLOCK">333</div>
    </div>

</body>
</html>
