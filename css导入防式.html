<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css导入方式练习</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        p {
            color: red ;
            font-size: 36px;
        }
    </style>
</head>
<body>
    <p>这是一个使用了内部样式表的段落</p>
    <p style="color: blue; font-size: 24px;">这是一个使用了内联样式的段落</p>
    <h1>这是一个使用了外部样式表的一级标签</h1>
</body>
</html>
